services:
  - type: web
    name: madeinmaia-shop
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    domains:
      - madeinmaia.pt
    disk:
      name: madeinmaia-media
      mountPath: /var/data
      sizeGB: 5
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: madeinmaia-shop-db
          property: connectionString
      - key: STUDIO_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /var/data/uploads
      - key: UPLOADS_PUBLIC_URL
        value: /uploads
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: ORDER_FROM_EMAIL
        value: Made in Maia <loja@madeinmaia.pt>

databases:
  - name: madeinmaia-shop-db
    plan: 0.1c-256mb
