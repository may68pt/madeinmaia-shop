<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ask the 8 — Shake for an Answer</title>
<meta name="description" content="Ask a yes-or-no question and shake the 8 ball for your answer.">
<meta name="theme-color" content="#0b0820">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Archivo+Black&family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --s: min(78vw, 340px, 50vh);
    --ink:#ecebff;
    --muted:rgba(236,235,255,.62);
    --h:250;                                   /* driven by JS: slowly cycles 0–360 */
    --accent:hsl(var(--h) 100% 70%);
    --c1:hsl(var(--h) 95% 62%);
    --c2:hsl(calc(var(--h) + 95) 95% 60%);
    --c3:hsl(calc(var(--h) + 190) 95% 62%);
    --c4:hsl(calc(var(--h) + 280) 95% 64%);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:0;
    padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    background:#06050e;
    color:var(--ink);
    font-family:Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    overflow-x:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  /* ---------- ambient aurora ---------- */
  .aurora{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
  .blob{
    position:absolute;width:85vmax;height:85vmax;border-radius:50%;
    opacity:.42;mix-blend-mode:screen;will-change:transform;
    transition:opacity 1s ease;
  }
  .blob.a{background:radial-gradient(circle, var(--c1) 0%, transparent 62%);top:-35vmax;left:-30vmax;animation:driftA 26s ease-in-out infinite alternate}
  .blob.b{background:radial-gradient(circle, var(--c2) 0%, transparent 62%);bottom:-40vmax;right:-35vmax;animation:driftB 31s ease-in-out infinite alternate}
  .blob.c{background:radial-gradient(circle, var(--c3) 0%, transparent 62%);top:20%;left:-45vmax;animation:driftC 37s ease-in-out infinite alternate;opacity:.3}
  .blob.d{background:radial-gradient(circle, var(--c4) 0%, transparent 62%);top:-30vmax;right:-45vmax;animation:driftD 29s ease-in-out infinite alternate;opacity:.32}
  @keyframes driftA{0%{transform:translate(0,0) scale(1)}50%{transform:translate(25vw,20vh) scale(1.15)}100%{transform:translate(10vw,45vh) scale(.9)}}
  @keyframes driftB{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-30vw,-25vh) scale(1.2)}100%{transform:translate(-10vw,-50vh) scale(.95)}}
  @keyframes driftC{0%{transform:translate(0,0) scale(.9)}50%{transform:translate(40vw,-15vh) scale(1.1)}100%{transform:translate(60vw,20vh) scale(1)}}
  @keyframes driftD{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-35vw,30vh) scale(.9)}100%{transform:translate(-55vw,10vh) scale(1.2)}}
  .halo{ /* soft spotlight behind the ball */
    position:absolute;left:50%;top:50%;width:120vmin;height:120vmin;transform:translate(-50%,-50%);
    background:radial-gradient(circle, color-mix(in srgb, var(--c1) 40%, transparent) 0%, transparent 55%);
    opacity:.55;animation:breathe 7s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.95)}50%{opacity:.7;transform:translate(-50%,-50%) scale(1.06)}}
  .vignette{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%, transparent 35%, rgba(4,3,10,.75) 100%)}
  body.excited .blob{opacity:.7}
  body.excited .halo{opacity:.95}

  /* faint twinkling stars */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.55;z-index:0;
    animation:twinkle 6s ease-in-out infinite;
    background-image:
      radial-gradient(1px 1px at 12% 18%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 82% 12%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 70% 78%, #cfc8ff 50%, transparent 51%),
      radial-gradient(1px 1px at 24% 72%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 91% 54%, #fff 50%, transparent 51%),
      radial-gradient(1.5px 1.5px at 6% 46%, #cfc8ff 50%, transparent 51%),
      radial-gradient(1px 1px at 45% 6%, #fff 50%, transparent 51%),
      radial-gradient(1px 1px at 58% 94%, #fff 50%, transparent 51%);
  }
  @keyframes twinkle{0%,100%{opacity:.35}50%{opacity:.75}}

  header{text-align:center;position:relative;z-index:1}
  h1{
    font-family:Bungee, Archivo Black, sans-serif;
    font-weight:400;
    font-size:clamp(34px, 10vw, 56px);
    line-height:1;margin:0;letter-spacing:.02em;
    background:linear-gradient(100deg, #fff 0%, color-mix(in srgb, var(--c1) 55%, #fff) 35%, color-mix(in srgb, var(--c2) 55%, #fff) 65%, color-mix(in srgb, var(--c4) 55%, #fff) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 18px color-mix(in srgb, var(--c1) 55%, transparent));
  }
  .tagline{margin:10px 0 0;color:var(--muted);font-size:15px}

  .ask{
    position:relative;z-index:1;
    margin:20px 0 0;width:min(92vw,380px);
  }
  .ask input{
    width:100%;
    font:500 16px/1.2 Inter, system-ui, sans-serif;
    color:var(--ink);
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;
    padding:13px 18px;
    outline:none;
    text-align:center;
    transition:border-color .2s, background .2s;
  }
  .ask input::placeholder{color:rgba(236,235,255,.45)}
  .ask input:focus{border-color:var(--accent);background:color-mix(in srgb, var(--accent) 12%, transparent);box-shadow:0 0 24px color-mix(in srgb, var(--accent) 35%, transparent)}

  .stage{
    position:relative;
    width:var(--s);height:var(--s);
    margin:30px 0 14px;
    touch-action:none;
    outline:none;
    z-index:1;
  }
  .stage:focus-visible .ball{outline:3px solid var(--accent);outline-offset:6px}
  .floor{
    position:absolute;left:12%;right:12%;bottom:-9%;height:12%;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 70%);
    filter:blur(3px);
    transition:transform .3s;
  }
  .mover{position:absolute;inset:0;will-change:transform}
  .mover.spring{transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
  .ball{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 33% 27%, #6a6a78 0%, #2a2a33 16%, #0e0e13 42%, #000 72%);
    box-shadow:
      inset -14px -20px 44px rgba(0,0,0,.95),
      inset 8px 10px 26px rgba(255,255,255,.06),
      -18px -10px 70px color-mix(in srgb, var(--c1) 40%, transparent),
      20px 16px 80px color-mix(in srgb, var(--c2) 35%, transparent),
      0 0 120px color-mix(in srgb, var(--c4) 22%, transparent);
    transition:box-shadow .6s ease;
    cursor:grab;user-select:none;-webkit-user-select:none;
  }
  .stage.dragging .ball{cursor:grabbing}
  .shine{
    position:absolute;top:8%;left:15%;width:40%;height:24%;border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(255,255,255,.5) 0%, rgba(255,255,255,.12) 45%, rgba(255,255,255,0) 72%);
    transform:rotate(-32deg);pointer-events:none;z-index:3;
  }
  .rim-light{
    position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:
      radial-gradient(circle at 80% 84%, color-mix(in srgb, var(--c2) 30%, transparent) 0%, transparent 30%),
      radial-gradient(circle at 14% 70%, color-mix(in srgb, var(--c4) 18%, transparent) 0%, transparent 26%);
  }
  .ball.shaking{
    box-shadow:
      inset -14px -20px 44px rgba(0,0,0,.95),
      -24px -14px 90px color-mix(in srgb, var(--c1) 65%, transparent),
      26px 20px 100px color-mix(in srgb, var(--c2) 60%, transparent),
      0 0 160px color-mix(in srgb, var(--c4) 45%, transparent);
  }
  .face{position:absolute;inset:27%;border-radius:50%}

  .eight{
    position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 40% 34%, #ffffff 0%, #ececec 55%, #bdbdbd 100%);
    box-shadow: inset -4px -6px 12px rgba(0,0,0,.25), 0 2px 6px rgba(0,0,0,.6);
    display:grid;place-items:center;
    font-family:"Archivo Black", Bungee, sans-serif;
    font-size:calc(var(--s) * .26);line-height:1;color:#0d0d0d;
    transition:opacity .45s ease, transform .6s cubic-bezier(.5,0,.3,1);
  }
  .eight span{transform:translateY(2%)}

  .window{
    position:absolute;inset:-3%;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle at 50% 46%, #11225e 0%, #071139 45%, #020617 80%, #01020a 100%);
    box-shadow:
      0 0 0 calc(var(--s) * .016) #15151b,
      0 0 0 calc(var(--s) * .028) #3a3a44,
      inset 0 0 calc(var(--s) * .07) #000;
    opacity:0;transform:scale(.55) translateX(60%);
    transition:opacity .5s ease .1s, transform .7s cubic-bezier(.3,1.2,.4,1);
  }
  .window::after{ /* glass vignette + glare */
    content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:
      radial-gradient(ellipse 40% 22% at 34% 20%, rgba(255,255,255,.18), rgba(255,255,255,0) 70%),
      radial-gradient(circle at 50% 50%, rgba(0,0,0,0) 48%, rgba(0,0,0,.65) 100%);
  }
  .swirl{
    position:absolute;inset:-30%;
    background:conic-gradient(from 0deg, rgba(60,90,220,0), rgba(60,90,220,.22), rgba(60,90,220,0) 35%, rgba(90,60,220,.18) 60%, rgba(60,90,220,0) 80%);
    filter:blur(12px);opacity:.5;
    animation:swirl 14s linear infinite;
  }
  .ball.shaking .swirl{animation-duration:1.4s;opacity:.9}
  @keyframes swirl{to{transform:rotate(360deg)}}

  .bubble{position:absolute;border-radius:50%;background:rgba(170,200,255,.5);opacity:0}
  .ball.shaking .bubble{animation:bub 1s ease-in infinite}
  .bubble.b1{width:5%;height:5%;left:30%;bottom:10%}
  .bubble.b2{width:3.5%;height:3.5%;left:62%;bottom:8%;animation-delay:.3s !important}
  .bubble.b3{width:4%;height:4%;left:48%;bottom:4%;animation-delay:.6s !important}
  @keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(-1100%);opacity:0}}

  .ball.flipped .eight{opacity:0;transform:scale(.5) translateX(-70%)}
  .ball.flipped .window{opacity:1;transform:none}

  .die{
    position:absolute;left:50%;top:50%;width:80%;height:72%;
    transform:translate(-50%,-38%) scale(.62) rotate(-14deg);
    opacity:0;filter:blur(7px) brightness(.5);
    transition:opacity .3s ease, filter .3s ease, transform .3s ease;
  }
  .die.show{
    transform:translate(-50%,-50%) scale(1) rotate(0deg);
    opacity:1;filter:blur(0) brightness(1);
    transition:opacity 1.5s ease, filter 1.7s ease, transform 1.8s cubic-bezier(.15,.85,.25,1);
  }
  .die.show.settled{animation:bob 4.5s ease-in-out infinite}
  @keyframes bob{
    0%,100%{transform:translate(-50%,-50%) rotate(0deg)}
    50%{transform:translate(-50%,-52%) rotate(1.2deg)}
  }
  .die svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .answer{
    position:absolute;left:21%;right:21%;top:40%;bottom:12%;
    display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:Oswald, "Arial Narrow", sans-serif;font-weight:600;
    font-size:calc(var(--s) * .043);line-height:1.1;
    text-transform:uppercase;letter-spacing:.05em;
    color:#eef3ff;
    text-shadow:0 0 6px rgba(150,190,255,.75), 0 0 1px #fff;
    text-wrap:balance;
  }

  .ball.shaking{animation:jitter .13s linear infinite}
  @keyframes jitter{
    0%{transform:translate(0,0) rotate(0)}
    25%{transform:translate(-3%,2%) rotate(-7deg)}
    50%{transform:translate(3%,-2%) rotate(6deg)}
    75%{transform:translate(-2%,-3%) rotate(-3deg)}
    100%{transform:translate(0,0) rotate(0)}
  }
  .stage.idle .mover{animation:float 5s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-2.5%)}}

  .asked{
    min-height:1.4em;margin:12px 0 0;max-width:min(92vw,420px);
    text-align:center;color:var(--muted);font-style:italic;font-size:15px;
    opacity:0;transition:opacity .6s ease .6s;position:relative;z-index:1;
  }
  .asked.on{opacity:1}
  .hint{
    margin:6px 0 0;font-size:14px;font-weight:500;letter-spacing:.02em;
    color:color-mix(in srgb, var(--accent) 60%, #fff);text-align:center;position:relative;z-index:1;
    animation:pulse 2.6s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  .row{display:flex;gap:10px;margin-top:18px;position:relative;z-index:1;flex-wrap:wrap;justify-content:center}
  .btn{
    font:600 14px/1 Inter, system-ui, sans-serif;color:var(--ink);
    background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:11px 16px;cursor:pointer;
    display:inline-flex;align-items:center;gap:8px;
    transition:background .2s, border-color .2s, transform .1s;
  }
  .btn:hover{background:rgba(255,255,255,.12)}
  .btn:active{transform:scale(.97)}
  .btn.primary{background:linear-gradient(120deg, color-mix(in srgb, var(--c1) 80%, #000), color-mix(in srgb, var(--c4) 80%, #000));border-color:transparent;color:#fff;box-shadow:0 6px 24px color-mix(in srgb, var(--c1) 45%, transparent)}
  .btn.primary:hover{filter:brightness(1.12)}
  .btn[hidden]{display:none}
  .btn svg{width:16px;height:16px}

  .sound{
    position:fixed;top:max(14px, env(safe-area-inset-top));right:max(14px, env(safe-area-inset-right));
    z-index:5;width:40px;height:40px;padding:0;justify-content:center;
  }

  footer{margin-top:22px;font-size:12px;color:rgba(236,235,255,.38);text-align:center;position:relative;z-index:1}

  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  @media (prefers-reduced-motion: reduce){
    .stage.idle .mover, .hint, .die.show.settled, .blob, .halo, body::before{animation:none}
    .ball.shaking{animation-duration:.3s}
  }
  @media (max-height:640px){
    .tagline{display:none}
    .stage{margin:18px 0 10px}
    .ask{margin-top:14px}
  }
</style>
</head>
<body>

<div class="aurora" aria-hidden="true">
  <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div><div class="blob d"></div>
  <div class="halo"></div>
  <div class="vignette"></div>
</div>

<button class="btn sound" id="soundBtn" aria-label="Mute sound" title="Sound on/off">
  <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
</button>

<header>
  <h1>Ask the 8</h1>
  <p class="tagline">Can't decide? Let the ball choose.</p>
</header>

<form class="ask" id="askForm" autocomplete="off">
  <label class="sr" for="q">Your yes-or-no question</label>
  <input id="q" type="text" maxlength="90" placeholder="Ask a yes-or-no question…" enterkeyhint="go">
</form>

<div class="stage idle" id="stage" tabindex="0" role="button" aria-label="Shake the 8 ball">
  <div class="floor" id="floor"></div>
  <div class="mover" id="mover">
    <div class="ball" id="ball">
      <div class="rim-light"></div>
      <div class="face">
        <div class="eight"><span>8</span></div>
        <div class="window">
          <div class="swirl"></div>
          <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div>
          <div class="die" id="die">
            <svg viewBox="0 0 100 90" preserveAspectRatio="none" aria-hidden="true">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#3a63ff"/>
                  <stop offset="1" stop-color="#1630a8"/>
                </linearGradient>
              </defs>
              <polygon points="50,3 97,86 3,86" fill="url(#g)" stroke="#6f8cff" stroke-width="1.6" stroke-linejoin="round" opacity=".95"/>
            </svg>
            <div class="answer" id="answer"></div>
          </div>
        </div>
      </div>
      <div class="shine"></div>
    </div>
  </div>
</div>

<p class="asked" id="asked"></p>
<p class="hint" id="hint">Tap or flick the ball to shake it</p>

<div class="row">
  <button class="btn primary" id="motionBtn" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M3 8v8M21 8v8"/></svg>
    Turn on shake
  </button>
  <button class="btn" id="shareBtn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>
    <span>Share</span>
  </button>
</div>

<footer>For entertainment only. The ball has no idea what it's talking about.</footer>

<div class="sr" aria-live="polite" id="live"></div>

<script>
(() => {
  // ---------- Answers: 10 yes · 5 maybe · 5 no ----------
  const ANSWERS = [
    "Yes, go for it", "Absolutely", "The stars say yes", "Do it. Now.", "Count on it",
    "100% yes", "Trust your gut: yes", "All signs say go", "Odds are good", "Yes, obviously",
    "Too foggy to tell", "Sleep on it", "Shake me again", "Not clear yet", "Flip a coin",
    "Nope", "Not a chance", "Hard pass", "The stars say no", "Skip this one"
  ];

  const $ = id => document.getElementById(id);
  const stage = $('stage'), mover = $('mover'), ball = $('ball'), die = $('die'),
        answerEl = $('answer'), hint = $('hint'), asked = $('asked'), live = $('live'),
        q = $('q'), floor = $('floor');

  let shaking = false, flipped = false, endTimer = null, settleTimer = null, lastIdx = -1;

  // ---------- Slow hue cycle for all glows / UI accents ----------
  const root = document.documentElement;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let hue = 250, speed = 0, lastT = performance.now(), lastPaint = 0;
  function tick(now){
    const dt = Math.min(100, now - lastT) / 1000; lastT = now;
    const target = shaking ? 90 : (reduce ? 2 : 7);   // degrees per second
    speed += (target - speed) * Math.min(1, dt * 2.5); // ease between calm and excited
    hue = (hue + speed * dt) % 360;
    if (now - lastPaint > 50){                         // ~20 updates/sec is plenty for a slow fade
      root.style.setProperty('--h', hue.toFixed(1));
      lastPaint = now;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);

  // ---------- Sound (Web Audio "slosh") ----------
  let ctx = null, muted = false;
  try { muted = localStorage.getItem('ask8-muted') === '1'; } catch (e) {}
  function unlockAudio(){
    try {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
    } catch (e) {}
  }
  function slosh(){
    if (muted || !ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime, dur = .75;
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const src = ctx.createBufferSource(); src.buffer = buf;
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2.2;
    bp.frequency.setValueAtTime(260, t);
    bp.frequency.linearRampToValueAtTime(820, t + .18);
    bp.frequency.linearRampToValueAtTime(380, t + .4);
    bp.frequency.linearRampToValueAtTime(640, t + .55);
    bp.frequency.linearRampToValueAtTime(300, t + dur);
    const g = ctx.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(.35, t + .08);
    g.gain.linearRampToValueAtTime(.12, t + .35);
    g.gain.linearRampToValueAtTime(.22, t + .5);
    g.gain.linearRampToValueAtTime(0, t + dur);
    src.connect(bp).connect(g).connect(ctx.destination);
    src.start(t); src.stop(t + dur);
  }
  function chime(){
    if (muted || !ctx || ctx.state !== 'running') return;
    const t = ctx.currentTime;
    [523.25, 783.99].forEach((f, i) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + i*.09);
      g.gain.linearRampToValueAtTime(.06, t + i*.09 + .03);
      g.gain.exponentialRampToValueAtTime(.0001, t + i*.09 + 1.2);
      o.connect(g).connect(ctx.destination); o.start(t + i*.09); o.stop(t + i*.09 + 1.3);
    });
  }
  const soundBtn = $('soundBtn');
  function renderSound(){
    $('iconOn').style.display = muted ? 'none' : '';
    $('iconOff').style.display = muted ? '' : 'none';
    soundBtn.setAttribute('aria-label', muted ? 'Unmute sound' : 'Mute sound');
  }
  soundBtn.addEventListener('click', () => {
    muted = !muted; unlockAudio(); renderSound();
    try { localStorage.setItem('ask8-muted', muted ? '1' : '0'); } catch (e) {}
  });
  renderSound();

  // ---------- Shake / reveal ----------
  function startShake(holdMs){
    stage.classList.remove('idle');
    if (!shaking){
      shaking = true;
      clearTimeout(settleTimer);
      die.classList.remove('show','settled');
      asked.classList.remove('on');
      ball.classList.add('shaking');
      document.body.classList.add('excited');
      slosh();
      try { navigator.vibrate && navigator.vibrate([25, 40, 25, 40, 25]); } catch (e) {}
    }
    clearTimeout(endTimer);
    endTimer = setTimeout(endShake, holdMs || 450);
  }

  function endShake(){
    shaking = false;
    ball.classList.remove('shaking');
    document.body.classList.remove('excited');
    if (!flipped){ ball.classList.add('flipped'); flipped = true; }

    let i; do { i = Math.floor(Math.random() * ANSWERS.length); } while (i === lastIdx);
    lastIdx = i;
    answerEl.textContent = ANSWERS[i];

    const question = q.value.trim();
    asked.textContent = question ? '“' + question.replace(/\?*$/, '') + '?”' : '';
    asked.classList.toggle('on', !!question);

    setTimeout(() => {
      die.classList.add('show');
      chime();
      live.textContent = 'The 8 ball says: ' + ANSWERS[i];
      settleTimer = setTimeout(() => die.classList.add('settled'), 1900);
    }, flipped ? 260 : 500);

    hint.textContent = 'Shake again to ask another';
  }

  // ---------- Drag / flick / tap ----------
  let dragging = false, sx = 0, sy = 0, lx = 0, ly = 0, lt = 0, travel = 0;
  const S = () => stage.getBoundingClientRect().width;

  stage.addEventListener('pointerdown', e => {
    unlockAudio();
    dragging = true; travel = 0;
    sx = lx = e.clientX; sy = ly = e.clientY; lt = performance.now();
    mover.classList.remove('spring');
    stage.classList.add('dragging');
    stage.classList.remove('idle');
    try { stage.setPointerCapture(e.pointerId); } catch (err) {}
  });

  stage.addEventListener('pointermove', e => {
    if (!dragging) return;
    const now = performance.now();
    const step = Math.hypot(e.clientX - lx, e.clientY - ly);
    const speed = step / Math.max(1, now - lt);         // px per ms
    travel += step; lx = e.clientX; ly = e.clientY; lt = now;

    const lim = S() * .28;
    const dx = Math.max(-lim, Math.min(lim, (e.clientX - sx) * .6));
    const dy = Math.max(-lim, Math.min(lim, (e.clientY - sy) * .6));
    mover.style.transform = `translate(${dx}px, ${dy}px) rotate(${dx * .12}deg)`;
    floor.style.transform = `translateX(${dx * .5}px) scale(${1 - Math.abs(dy) / S()})`;

    if (speed > .9 && travel > 40) startShake(450);
  });

  function release(){
    if (!dragging) return;
    dragging = false;
    stage.classList.remove('dragging');
    mover.classList.add('spring');
    mover.style.transform = '';
    floor.style.transform = '';
    if (travel < 12) startShake(850);       // a tap
    else if (!shaking) startShake(600);     // a slow drag still counts
  }
  stage.addEventListener('pointerup', release);
  stage.addEventListener('pointercancel', release);

  stage.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); unlockAudio(); startShake(850); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === ' ' && document.activeElement !== q && document.activeElement !== stage
        && !(document.activeElement && document.activeElement.tagName === 'BUTTON')){
      e.preventDefault(); unlockAudio(); startShake(850);
    }
  });
  $('askForm').addEventListener('submit', e => {
    e.preventDefault(); unlockAudio(); q.blur(); startShake(850);
  });

  // ---------- Real phone shake (DeviceMotion) ----------
  const isTouch = matchMedia('(pointer: coarse)').matches;
  const motionBtn = $('motionBtn');
  let lastA = null, spikes = [];
  function onMotion(e){
    const a = e.accelerationIncludingGravity || e.acceleration;
    if (!a || a.x == null) return;
    if (lastA){
      const d = Math.abs(a.x - lastA.x) + Math.abs(a.y - lastA.y) + Math.abs(a.z - lastA.z);
      if (d > 18){
        const now = performance.now();
        spikes = spikes.filter(t => now - t < 700); spikes.push(now);
        if (shaking || spikes.length >= 2) startShake(500);
      }
    }
    lastA = { x: a.x, y: a.y, z: a.z };
  }
  function listenMotion(){
    window.addEventListener('devicemotion', onMotion);
    hint.textContent = flipped ? 'Shake again to ask another' : 'Shake your phone — or tap the ball';
  }

  if (isTouch && 'DeviceMotionEvent' in window){
    if (typeof DeviceMotionEvent.requestPermission === 'function'){
      // iOS: needs a tap to grant motion access
      motionBtn.hidden = false;
      hint.textContent = 'Tap or flick the ball — or turn on shake';
      motionBtn.addEventListener('click', () => {
        unlockAudio();
        DeviceMotionEvent.requestPermission()
          .then(r => { motionBtn.hidden = true; if (r === 'granted') listenMotion(); else hint.textContent = 'Tap or flick the ball to shake it'; })
          .catch(() => { motionBtn.hidden = true; hint.textContent = 'Tap or flick the ball to shake it'; });
      });
    } else {
      listenMotion();
    }
  } else if (!isTouch){
    hint.textContent = 'Click or drag the ball to shake it · Space works too';
  }

  // ---------- Share ----------
  const shareBtn = $('shareBtn');
  shareBtn.addEventListener('click', async () => {
    const url = location.href.split('#')[0];
    const label = shareBtn.querySelector('span');
    try {
      if (navigator.share){ await navigator.share({ title: 'Ask the 8', text: 'Can’t decide? Ask the 8 ball.', url }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(url); label.textContent = 'Link copied!'; }
    catch (e) { label.textContent = 'Copy the URL above'; }
    setTimeout(() => label.textContent = 'Share', 2200);
  });
})();
</script>
</body>
</html>
