<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<base href="/everydaylife-app/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Every Day — Paulo & Luna</title>
<meta name="theme-color" content="#1a1c2c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Every Day">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a1c2c;--deep:#29366f;--panel:#333c57;--panel2:#566c86;--ink:#f4f4f4;--mute:#94b0c2;--honey:#ffcd75;--gold:#f4b41b;--org:#ef7d57;--red:#b13e53;--green:#38b764;--lime:#a7f070;--blue:#3b5dc9;--sky:#41a6f6;--cyan:#73eff7;--plum:#5d275d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);background-image:radial-gradient(#29366f 1px,transparent 1px);background-size:8px 8px;color:var(--ink);font-family:'VT323',monospace;font-size:20px;line-height:1.1}
.pf,h1,h2,h3,button,.chip{font-family:'Press Start 2P',monospace;font-weight:normal}
h2{font-size:12px;margin:18px 4px 10px;color:var(--honey);text-shadow:2px 2px 0 #000}
h3{font-size:10px;margin:14px 4px 8px;color:var(--cyan);text-shadow:2px 2px 0 #000}
small{color:var(--mute);font-size:17px}
#app{max-width:560px;margin:0 auto;padding-bottom:96px}
main{padding:0 10px}
.px{background:var(--panel);border:3px solid #000;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.14),4px 4px 0 #000}
button{font-size:9px;line-height:1.3;color:var(--ink);background:var(--blue);border:3px solid #000;border-radius:0;box-shadow:inset -3px -3px 0 rgba(0,0,0,.35),inset 3px 3px 0 rgba(255,255,255,.22);padding:8px 10px;cursor:pointer}
button:active{transform:translate(2px,2px);box-shadow:inset 3px 3px 0 rgba(0,0,0,.35)}
button:disabled{opacity:.4;cursor:not-allowed}
button.gold{background:var(--gold);color:#1a1c2c}button.red{background:var(--red)}button.green{background:var(--green)}button.ghost{background:var(--panel2)}button.org{background:var(--org)}
input,select,textarea{font-family:'VT323',monospace;font-size:20px;background:#12131f;color:var(--ink);border:3px solid #000;box-shadow:inset 3px 3px 0 rgba(0,0,0,.6);padding:6px 8px;width:100%;border-radius:0;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--gold)}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;min-height:40px}
.form>*,.row>*{min-width:0}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fit{flex:0 0 auto}
.card{padding:12px;margin:10px 0}
.form{display:grid;gap:8px;padding:12px;margin:14px 0}
.empty{text-align:center;color:var(--mute);padding:20px}
.spr{display:block;image-rendering:pixelated}
/* HUD */
.hud{display:flex;justify-content:space-between;align-items:center;margin:10px;padding:10px;gap:8px}
.who{display:flex;gap:10px;align-items:center}
.who b{font-size:11px;display:block;margin-bottom:4px}
.bar{height:10px;background:#000;border:2px solid #000;margin-top:5px;width:150px;max-width:38vw}
.bar i{display:block;height:100%;background:linear-gradient(var(--lime),var(--green))}
.stats{display:grid;gap:6px;text-align:right}
.stats .honey{font-size:13px;color:var(--honey);text-shadow:2px 2px 0 #000}
.hivebar{margin:0 10px 6px;font-size:17px;color:var(--mute);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.hivebar b{color:var(--honey)}
.sync{margin-left:auto;font-family:'Press Start 2P';font-size:7px}
.sync.remote{color:var(--lime)}.sync.local{color:var(--mute)}.sync.locked,.sync.offline{color:var(--org)}
/* nav */
nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:center;gap:3px;background:#000;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:5}
nav button{flex:1;max-width:76px;background:var(--panel);font-size:6px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button span{font-size:19px;font-family:system-ui,sans-serif;line-height:1}
nav button.on{background:var(--gold);color:#1a1c2c}
.badge{position:absolute;top:-4px;right:2px;background:var(--red);color:#fff;border:2px solid #000;font-size:7px;padding:2px 4px}
/* chips */
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chip{flex:0 0 auto;font-size:8px;background:var(--panel)}
.chip.on{background:var(--gold);color:#1a1c2c}
.chip em{font-style:normal;color:var(--org);margin-left:3px}
.chip.on em{color:var(--plum)}
.period{font-size:17px;color:var(--mute);margin:0 4px 6px}
/* quests */
.quests{list-style:none;margin:0;padding:0}
.quest{display:flex;align-items:center;gap:10px;padding:8px;margin:8px 0;border-left:8px solid var(--cat)}
.quest .chk{width:38px;height:38px;flex:0 0 38px;background:#12131f;font-size:16px;color:var(--lime);padding:0}
.quest.done{background:#283a3a}
.quest.done .qt b{text-decoration:line-through;color:var(--mute)}
.quest.theirs{opacity:.7}
.qt{flex:1;min-width:0}.qt b{display:block;font-weight:normal;font-size:21px;overflow-wrap:anywhere}
.qh{font-family:'Press Start 2P';font-size:9px;color:var(--honey);white-space:nowrap}
.x{background:transparent;border:0;box-shadow:none;color:var(--mute);padding:4px;font-size:10px}
/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
.calhead b{font-family:'Press Start 2P';font-size:11px}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.dow{text-align:center;font-family:'Press Start 2P';font-size:7px;color:var(--mute);padding:4px 0}
.cd{aspect-ratio:1;background:var(--panel);padding:3px;display:flex;flex-direction:column;align-items:flex-start;justify-content:space-between;font-size:8px;position:relative;box-shadow:none;border-width:2px}
.cd.empty{background:transparent;border:0}
.cd.today{background:var(--deep);outline:2px solid var(--cyan)}
.cd.sel{background:var(--gold);color:#1a1c2c}
.dots{display:flex;gap:2px;flex-wrap:wrap}.dots i{width:6px;height:6px;border:1px solid #000;display:block}
.cd em{font-style:normal;font-family:'VT323';font-size:13px;position:absolute;right:2px;top:2px;color:var(--honey)}
.cd.sel em{color:var(--plum)}
.ev{display:flex;gap:10px;align-items:center;padding:8px;margin:6px 0;border-left:8px solid var(--c)}
.ev time{font-family:'Press Start 2P';font-size:8px;color:var(--honey);min-width:42px}
/* chat */
#msgs{height:calc(100vh - 330px);min-height:260px;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.msg{display:flex;gap:6px;align-items:flex-end;max-width:85%}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:8px 10px;border:3px solid #000;background:var(--panel2);box-shadow:3px 3px 0 #000;overflow-wrap:anywhere}
.msg.mine .bub{background:var(--blue)}
.msg.luna .bub{background:#7a3b4a}.msg.mine.luna .bub{background:#7a3b4a}
.msg.paulo.mine .bub,.msg.paulo .bub{background:#2b4f8f}
.bub small{display:block;font-size:14px;margin-top:3px}
.quick{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.quick button{font-size:16px;font-family:system-ui;padding:4px 8px;background:var(--panel)}
/* wall */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.bdg{padding:10px;text-align:center;position:relative}
.bdg .ic{font-size:32px;font-family:system-ui;display:block;margin-bottom:6px}
.bdg b{font-family:'Press Start 2P';font-size:8px;display:block;margin-bottom:5px;line-height:1.4}
.bdg.locked{filter:grayscale(1) brightness(.55)}
.bdg .by{display:flex;justify-content:center;gap:4px;margin-top:6px}
.tag{font-family:'Press Start 2P';font-size:7px;padding:3px 5px;border:2px solid #000}
.tag.paulo{background:var(--sky);color:#000}.tag.luna{background:var(--org);color:#000}.tag.hive{background:var(--gold);color:#000}
.trophy{display:flex;gap:10px;align-items:center;padding:10px;margin:8px 0}
.trophy .ic{font-size:30px;font-family:system-ui}
.progress{height:14px;background:#000;border:2px solid #000;margin:6px 0}
.progress i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,var(--honey) 8px 16px)}
/* tree */
.vrow{display:grid;grid-template-columns:108px 1fr 26px 30px 22px 30px;gap:6px;align-items:center;margin:6px 0}
.vrow button{padding:4px 0;font-size:10px}
.vrow em{font-style:normal;text-align:center;font-family:'Press Start 2P';font-size:9px}
.vrow b{font-family:'Press Start 2P';font-size:9px;text-align:right}
.vbar{height:14px;background:#000;border:2px solid #000}.vbar i{display:block;height:100%}
.tree{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.branch{display:flex;flex-direction:column;align-items:center;gap:0;padding:8px 4px}
.branch .tok{font-family:'Press Start 2P';font-size:8px;color:var(--honey);margin-bottom:6px}
.node{width:100%;padding:6px 3px;text-align:center;font-size:15px;background:#12131f;border:3px solid #000;line-height:1}
.node b{display:block;font-family:'Press Start 2P';font-size:6px;margin-bottom:3px;line-height:1.3}
.node.on{background:var(--c);color:#000}
.node.on small{color:#1a1c2c}
.node button{font-size:6px;padding:4px;margin-top:4px;width:100%}
.trunk{width:6px;height:10px;background:#8a5a2b;border-left:2px solid #000;border-right:2px solid #000}
.branch .root{font-size:22px;font-family:system-ui;margin-top:4px}
.branch .nm{font-family:'Press Start 2P';font-size:6px;margin-top:3px}
/* vault */
.vault{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vault button{aspect-ratio:1;padding:0;background:#000 center/cover no-repeat;position:relative;overflow:hidden}
.vault .vid{display:flex;align-items:center;justify-content:center;font-size:28px;background-color:var(--plum)}
.lb img,.lb iframe,.lb video{width:100%;max-height:60vh;object-fit:contain;background:#000;border:3px solid #000;display:block}
.lb iframe{aspect-ratio:16/9;height:auto}
/* hive */
.hex{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px auto;max-width:270px;transform:translateX(-12px)}
.hex i{aspect-ratio:1/1.1;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#3a3420;display:block}
.hex i.f{background:linear-gradient(var(--honey),var(--gold))}
.hex i:nth-child(12n+7),.hex i:nth-child(12n+8),.hex i:nth-child(12n+9),.hex i:nth-child(12n+10),.hex i:nth-child(12n+11),.hex i:nth-child(12n+12){transform:translateX(50%)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp .card{text-align:center}
.cmp .big{font-family:'Press Start 2P';font-size:14px;color:var(--honey);margin:6px 0}
.log li{display:flex;justify-content:space-between;gap:8px;padding:6px 4px;border-bottom:2px dashed #29366f}
.log{list-style:none;padding:0;margin:0}
.pos{color:var(--lime)}.neg{color:var(--org)}
.rw{display:flex;align-items:center;gap:10px;padding:10px;margin:8px 0}
.rw .ic{font-size:28px;font-family:system-ui}
/* login */
.login{text-align:center;padding:30px 14px}
.logo{font-family:'Press Start 2P';font-size:30px;color:var(--honey);text-shadow:4px 4px 0 var(--org),8px 8px 0 #000;margin:20px 0 6px;line-height:1.3}
.players{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:26px 0}
.player{padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--panel)}
.player b{font-size:12px}
.player small{font-size:14px;word-break:break-all;font-family:'VT323'}
.blink{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.bob{animation:bob 1.2s steps(2) infinite}@keyframes bob{50%{transform:translateY(-4px)}}
/* overlay */
#modal .bg{position:fixed;inset:0;background:rgba(10,10,20,.82);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
#modal .box{max-width:460px;width:100%;padding:18px;max-height:90vh;overflow:auto}
.achpop{text-align:center}
.achpop .ic{font-size:64px;font-family:system-ui;display:block;margin:10px 0;animation:bob .8s steps(2) infinite}
.achpop .t{font-family:'Press Start 2P';font-size:10px;color:var(--lime);margin-bottom:10px}
#toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:30;display:grid;gap:6px;width:min(92vw,420px)}
#toast div{background:#000;color:var(--honey);border:3px solid var(--gold);padding:8px 12px;font-size:19px;box-shadow:4px 4px 0 #000}
.float{position:fixed;left:50%;top:40%;transform:translateX(-50%);font-family:'Press Start 2P';font-size:18px;color:var(--honey);text-shadow:3px 3px 0 #000;z-index:40;pointer-events:none;animation:up 1.1s steps(8) forwards}
@keyframes up{to{top:24%;opacity:0}}
.subtabs{display:flex;gap:6px;margin:10px 0}
.subtabs button{flex:1;font-size:8px;background:var(--panel)}.subtabs button.on{background:var(--cyan);color:#000}
.note{font-size:17px;color:var(--mute);padding:4px}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="mem_file" accept="image/*" multiple hidden>
<input type="file" id="import_file" accept="application/json,.json" hidden>
<script>
'use strict';
/* ============================================================
   EVERY DAY — alpha MVP · Made in Maia
   Data model: every collection is a list of {id, u(updated ms), del?}
   so two devices can merge safely (union by id, newest wins).
   ============================================================ */
const VERSION='0.1.0-alpha';
const LS='everyday.v1';
const BASE=document.querySelector('base')?new URL('.',document.baseURI).pathname:location.pathname.replace(/index\.html$/,'').replace(/\/?$/,'/');
const API=BASE+'api/state';

const USERS={
  paulo:{id:'paulo',name:'Paulo',email:'sagwi77@gmail.com',color:'#41a6f6'},
  luna:{id:'luna',name:'Luna',email:'luna.lux.coimbra@gmail.com',color:'#ef7d57'}
};
const CADS={
  daily:{n:'Daily',h:5,i:'☀️'},weekly:{n:'Weekly',h:15,i:'📅'},monthly:{n:'Monthly',h:40,i:'🌙'},
  yearly:{n:'Yearly',h:100,i:'⭐'},life:{n:'Life',h:250,i:'👑'}
};
const CATS={
  health:{n:'Health',i:'💪',c:'#b13e53',t:['Sprout','Athlete','Titans']},
  love:{n:'Love',i:'💞',c:'#ef7d57',t:['Spark','Flame','Soulmates']},
  money:{n:'Money',i:'💰',c:'#ffcd75',t:['Saver','Investor','Tycoons']},
  home:{n:'Home',i:'🏠',c:'#38b764',t:['Tidy','Nest','Castle']},
  create:{n:'Create',i:'🎨',c:'#a7f070',t:['Doodler','Maker','Masters']},
  adventure:{n:'Adventure',i:'🗺️',c:'#41a6f6',t:['Explorer','Voyager','Legends']},
  learn:{n:'Learn',i:'📚',c:'#3b5dc9',t:['Student','Scholar','Sages']},
  mind:{n:'Mind',i:'🧘',c:'#73eff7',t:['Calm','Focused','Zen']}
};
const COLS=['quests','completions','events','messages','achs','claims','votes','tree','rewards','redemptions','memories','ledger','profiles'];
const TREE_COST=[3,10,25], TREE_BONUS=[0,2,5,10], VOTES_PER_SEASON=5, SEASON_GOAL=10;
const TITLES=['Larva','Worker Bee','Forager','Honey Maker','Comb Builder','Hive Guard','Royal Jelly','Bee Legend','Hive Monarch'];

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>Date.now();
const pad=n=>String(n).padStart(2,'0');
const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const ym=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function isoWeek(d=new Date()){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const day=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-day);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return t.getUTCFullYear()+'-W'+pad(Math.ceil(((t-y0)/864e5+1)/7));}
function periodKey(cad,d=new Date()){return cad==='daily'?ymd(d):cad==='weekly'?isoWeek(d):cad==='monthly'?ym(d):cad==='yearly'?String(d.getFullYear()):'life';}
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmtDate=k=>{const [y,m,d]=k.split('-');return `${+d} ${MONTHS[+m-1].slice(0,3)} ${y}`;};
const fmtTime=ts=>{const d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes());};
const fmtWhen=ts=>{const d=new Date(ts);return ymd(d)===ymd()?fmtTime(ts):fmtDate(ymd(d))+' '+fmtTime(ts);};
const partner=()=>me==='paulo'?'luna':'paulo';
const whoLabel=w=>w==='team'?'👥 Team':w==='each'?'👫 Each':(USERS[w]?USERS[w].name:w);
const whoColor=w=>w==='paulo'?'#41a6f6':w==='luna'?'#ef7d57':'#ffcd75';
function hashPin(user,pin){let h=5381;const s='everyday:'+user+':'+pin;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))>>>0;return h.toString(36);}

/* ---------- store ---------- */
function blank(){const o={};COLS.forEach(k=>o[k]=[]);return o;}
function normalize(j){const o=blank();if(j)COLS.forEach(k=>{if(Array.isArray(j[k]))o[k]=j[k].filter(x=>x&&x.id)});return o;}
function load(){try{const j=JSON.parse(localStorage.getItem(LS));if(j)return normalize(j);}catch(e){}return blank();}
function save(){try{localStorage.setItem(LS,JSON.stringify(S));}catch(e){toast('⚠ Phone storage full — export a backup in Hive › Settings');}}
function mergeState(a,b){const out={};for(const k of COLS){const m=new Map();for(const it of (a[k]||[]))m.set(it.id,it);for(const it of (b[k]||[])){const x=m.get(it.id);if(!x||(it.u||0)>(x.u||0))m.set(it.id,it);}out[k]=[...m.values()];}return out;}
function sig(s){return COLS.map(k=>{let mx=0;for(const x of s[k])if((x.u||0)>mx)mx=x.u;return s[k].length+':'+mx;}).join('|');}
function put(col,item){item.u=Math.max(now(),...S[col].filter(x=>x.id===item.id).map(x=>(x.u||0)+1));const a=S[col];const i=a.findIndex(x=>x.id===item.id);if(i>=0)a[i]=Object.assign({},a[i],item);else a.push(item);save();Sync.dirty();}
function del(col,id){if(S[col].some(x=>x.id===id))put(col,{id,del:true});}
const live=col=>S[col].filter(x=>!x.del);

let S=load();
let me=localStorage.getItem('everyday.me');if(!USERS[me])me=null;
let tab='quests',questFilter='daily',calCursor=new Date(),calSel=ymd(),hiveSub='shop',vaultFilter='all',wallFilter='all';

function seed(){
  if(S.quests.some(q=>q.id.startsWith('seed_')))return;
  const q=(id,title,cad,who,cat)=>({id:'seed_'+id,title,cad,who,cat,honey:CADS[cad].h,by:'system',ts:now(),u:1});
  S.quests.push(
    q(1,'Make the bed','daily','team','home'),q(2,'Good-morning kiss','daily','each','love'),
    q(3,'30 min of movement','daily','each','health'),q(4,'Drink 2L of water','daily','each','health'),
    q(5,'Read 10 pages','daily','each','learn'),q(6,'Plan the week together','weekly','team','mind'),
    q(7,'Deep-clean the kitchen','weekly','team','home'),q(8,'Make something with our hands','weekly','team','create'),
    q(9,'Date night out','monthly','team','love'),q(10,'Money check-in & savings','monthly','team','money'),
    q(11,'Day trip somewhere new','monthly','team','adventure'),q(12,'Travel to a new country','yearly','team','adventure'),
    q(13,'Learn a new skill together','yearly','team','learn'),q(14,'Buy our own home','life','team','money'),
    q(15,'Run a half-marathon','life','each','health')
  );
  const r=(id,title,icon,cost)=>({id:'seedr_'+id,title,icon,cost,by:'system',ts:now(),u:1});
  S.rewards.push(r(1,'Movie night — I pick','🎬',30),r(2,'Breakfast in bed','🥐',60),r(3,'Skip one chore','🧹',50),

/* ---------- economy ---------- */
function honeyOf(u){let s=0;for(const l of live('ledger'))if(l.user===u)s+=l.honey||0;return s;}
function xpOf(u){let s=0;for(const l of live('ledger'))if(l.user===u)s+=l.xp||0;return s;}
function hiveTokens(){const t={};for(const c in CATS)t[c]=0;for(const l of live('ledger'))if(l.tokens)for(const c in l.tokens)t[c]=(t[c]||0)+l.tokens[c];return t;}
function earnedTokens(u){const t={};for(const c in CATS)t[c]=0;for(const l of live('ledger'))if(l.user===u&&l.tokens)for(const c in l.tokens)if(l.tokens[c]>0)t[c]+=l.tokens[c];return t;}
function levelOf(xp){const lv=Math.floor(Math.sqrt(Math.max(0,xp)/25))+1;const cur=25*(lv-1)**2,nxt=25*lv**2;return{lv,pct:(xp-cur)/(nxt-cur),cur,nxt};}
const titleOf=lv=>TITLES[Math.min(lv-1,TITLES.length-1)];
function doneFor(q,user){const key=periodKey(q.cad);return live('completions').find(c=>c.questId===q.id&&c.period===key&&(q.who==='team'||c.user===(q.who==='each'?user:q.who)));}
function daysSet(u){return new Set(live('completions').filter(c=>c.user===u).map(c=>c.day));}
function streakOf(u){const s=daysSet(u);const d=new Date();if(!s.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(s.has(ymd(d))){n++;d.setDate(d.getDate()-1);}return n;}
function treeLevel(cat){let n=0;for(let i=0;i<3;i++)if(live('tree').some(t=>t.id===cat+'_'+i))n=i+1;else break;return n;}
const season=()=>ym();
function voteTotals(se=season()){const t={};for(const v of live('votes'))if(v.season===se)for(const c in v.alloc)t[c]=(t[c]||0)+v.alloc[c];return t;}
function focusCat(){const t=voteTotals();let best=null,bv=0;for(const c in t)if(t[c]>bv){bv=t[c];best=c;}return best;}
function questHoney(q){let h=(+q.honey||0)+TREE_BONUS[treeLevel(q.cat)];if(focusCat()===q.cat)h*=2;return h;}
function seasonProgress(){const f=focusCat();if(!f)return 0;const qm=new Map(S.quests.map(q=>[q.id,q]));return live('completions').filter(c=>c.day&&c.day.startsWith(season())&&qm.get(c.questId)&&qm.get(c.questId).cat===f).length;}

/* ---- tree & voting ---- */
function vTree(){const se=season();const mine=live('votes').find(v=>v.id==='v_'+se+'_'+me);const alloc=(mine&&mine.alloc)||{};
  const used=Object.values(alloc).reduce((a,b)=>a+b,0);const tot=voteTotals();const mx=Math.max(1,...Object.values(tot));const f=focusCat();const tok=hiveTokens();const prog=seasonProgress();

  ${Object.entries(CATS).map(([k,c])=>`<div class="vrow"><span>${c.i} ${c.n}</span><div class="vbar"><i style="width:${(tot[k]||0)/mx*100}%;background:${c.c}"></i></div><b>${tot[k]||0}</b><button class="ghost" data-act="vote" data-c="${k}" data-d="-1">−</button><em>${alloc[k]||0}</em><button class="ghost" data-act="vote" data-c="${k}" data-d="1">+</button></div>`).join('')}

function vote(cat,d){const se=season(),id='v_'+se+'_'+me;const cur=live('votes').find(v=>v.id===id);const alloc=Object.assign({},cur&&cur.alloc);const used=Object.values(alloc).reduce((a,b)=>a+b,0);
  if(d>0&&used>=VOTES_PER_SEASON){toast('No votes left this month!');return;}const n=(alloc[cat]||0)+d;if(n<0)return;if(n===0)delete alloc[cat];else alloc[cat]=n;
  put('votes',{id,season:se,user:me,alloc,ts:now()});sfx('blip');checkAch();render();}
function unlock(cat,i){if(treeLevel(cat)!==i||hiveTokens()[cat]<TREE_COST[i])return;const c=CATS[cat];

function vVault(){const ms=live('memories').filter(m=>vaultFilter==='all'||m.type===vaultFilter).sort((a,b)=>(b.date||'').localeCompare(a.date||'')||b.ts-a.ts);

function openMem(id){const m=live('memories').find(x=>x.id===id);if(!m)return;const yt=m.type==='video'&&ytId(m.src);
  const media=m.type==='photo'?`<img src="${esc(m.src)}" alt="">`:yt?`<iframe src="https://www.youtube-nocookie.com/embed/${yt}" allowfullscreen></iframe>`:/\.(mp4|webm|mov)(\?|$)/i.test(m.src)?`<video src="${esc(m.src)}" controls playsinline></video>`:`<p><a href="${esc(m.src)}" target="_blank" rel="noopener" style="color:var(--cyan)">Open video ↗</a></p>`;
  modal(`<div class="lb">${media}<p>${esc(m.caption||'')}</p><small>${USERS[m.by]?USERS[m.by].name:''} · ${m.date?fmtDate(m.date):''}</small><div class="row" style="margin-top:12px">${m.by===me?`<button class="red" data-act="delmem" data-id="${m.id}">DELETE</button>`:''}<button class="ghost" data-act="close">CLOSE</button></div></div>`);}
function compress(file,max=900,q=.72){return new Promise((res,rej)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',q));};img.onerror=rej;img.src=url;});}

  qe:b=>sendMsg(b.dataset.v),
  gift:()=>{if(honeyOf(me)<10){toast('You need 10🍯 to gift');return;}const id=uid(),p=partner();
    put('ledger',{id:'g1_'+id,user:me,honey:-10,xp:0,gift:true,reason:'🎁 Gift to '+USERS[p].name,ts:now()});put('ledger',{id:'g2_'+id,user:p,honey:10,xp:0,gift:true,reason:'🎁 Gift from '+USERS[me].name,ts:now()});
    put('messages',{id:uid(),from:me,text:'🎁 sent you 10 honey!',ts:now()});sfx('buy');checkAch();render();},
  wf:b=>{wallFilter=b.dataset.v;render();},
  claim:()=>{const t=val('cl_t');if(!t){toast('What did you achieve?');return;}const h=Math.min(500,Math.max(5,parseInt(val('cl_h'))||50));
    put('claims',{id:uid(),by:me,title:t,cat:val('cl_k')||'mind',honey:h,verified:false,ts:now()});clear('cl_t','cl_h');toast(`Sent to ${USERS[partner()].name} for verification ⚖️`);render();},
  verify:b=>{const c=live('claims').find(x=>x.id===b.dataset.id);if(!c||c.by===me)return;put('claims',{id:c.id,verified:true,verifiedBy:me});
    put('ledger',{id:'cl_'+c.id,user:c.by,honey:c.honey,xp:c.honey,tokens:{[c.cat]:3},reason:'📜 '+c.title,ts:now()});sfx('ach');checkAch();render();},
  vote:b=>vote(b.dataset.c,+b.dataset.d),
  unlock:b=>unlock(b.dataset.c,+b.dataset.i),
  vf:b=>{vaultFilter=b.dataset.v;render();},
  addphoto:()=>document.getElementById('mem_file').click(),
  addvideo:()=>modal(`<h2>+ VIDEO</h2><input id="vid_url" placeholder="YouTube / Drive / iCloud link"><input id="vid_cap" placeholder="Caption" style="margin-top:8px"><input id="vid_date" type="date" value="${ymd()}" style="margin-top:8px"><div class="row" style="margin-top:10px"><button class="ghost" data-act="close">CANCEL</button><button class="gold" data-act="savevid">ADD</button></div>`),
  savevid:()=>{const u=val('vid_url');if(!/^https?:\/\//i.test(u)){toast('Paste a link starting with https://');return;}addMemory({type:'video',src:u,caption:val('vid_cap'),date:val('vid_date')||ymd()});closeModal();sfx('coin');floatText('+3 🍯');checkAch();render();},
  openmem:b=>openMem(b.dataset.id),
  delmem:b=>{if(confirm('Delete this memory?')){del('memories',b.dataset.id);del('ledger','m_'+b.dataset.id);closeModal();render();}},
  hs:b=>{hiveSub=b.dataset.v;render();},
  redeem:b=>{const r=live('rewards').find(x=>x.id===b.dataset.id);if(!r||honeyOf(me)<r.cost)return;if(!confirm(`Spend ${r.cost}🍯 on "${r.title}"?`))return;const id=uid();
    put('redemptions',{id,rewardId:r.id,title:r.title,icon:r.icon,cost:r.cost,by:me,ts:now(),delivered:false});put('ledger',{id:'r_'+id,user:me,honey:-r.cost,xp:0,reason:'🛍 '+r.title,ts:now()});
    put('messages',{id:uid(),from:me,text:`🛍 I just redeemed "${r.title}" — your move! 😄`,ts:now()});sfx('buy');checkAch();render();},
  deliver:b=>{put('redemptions',{id:b.dataset.id,delivered:true,deliveredBy:me});sfx('coin');render();},
  dr:b=>{if(confirm('Remove this reward from the shop?')){del('rewards',b.dataset.id);render();}},
  ar:()=>{const t=val('nr_t'),c=parseInt(val('nr_c'));if(!t||!c){toast('Name and price please');return;}put('rewards',{id:uid(),title:t,icon:val('nr_i')||'🎁',cost:Math.min(10000,Math.max(1,c)),by:me,ts:now()});clear('nr_t','nr_c','nr_i');render();},
  savekey:()=>{Sync.key=val('key_in');localStorage.setItem('everyday.key',Sync.key);toast('Connecting…');Sync.init();},
  export:()=>{const blob=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='everyday-backup-'+ymd()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);},
  import:()=>document.getElementById('import_file').click(),
  snd:()=>{localStorage.setItem('everyday.snd',soundOn()?'0':'1');sfx('blip');render();},
  reset:()=>{if(confirm('Erase all Every Day data on THIS device? (The server copy, if any, stays.)')){localStorage.removeItem(LS);location.reload();}}
};

document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACTS[b.dataset.act];if(f){f(b,e);}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;const id=e.target.id;
  if(id==='msg_in'){e.preventDefault();ACTS.send();}else if(id==='nq_t'){ACTS.aq();}else if(id==='ne_t'){ACTS.ae();}else if(id==='pin_in'){const b=$('[data-act="pinok"]');if(b)b.click();}else if(id==='pin_new'){ACTS.pinsave();}else if(id==='cl_t'){ACTS.claim();}});
document.getElementById('mem_file').addEventListener('change',async e=>{const files=[...e.target.files].slice(0,12);e.target.value='';if(!files.length)return;toast('Shrinking & saving '+files.length+' photo(s)…');
  for(const f of files){try{const src=await compress(f);addMemory({type:'photo',src,caption:'',date:ymd(new Date(f.lastModified||now()))});}catch(err){toast('Could not read '+f.name);}}
  sfx('coin');floatText('+'+files.length*3+' 🍯');checkAch();render();});
document.getElementById('import_file').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const r=new FileReader();r.onload=()=>{try{S=mergeState(S,normalize(JSON.parse(r.result)));save();Sync.dirty();toast('Backup merged ✔');render();}catch(err){toast('That file is not an Every Day backup');}};r.readAsText(f);});

/* ---------- sync ---------- */
const Sync={mode:'local',key:localStorage.getItem('everyday.key')||'',t:null,busy:false,poll:null,
  hdr(){return{'Content-Type':'application/json','x-hive-key':this.key};},
  label(){return({local:'● LOCAL',remote:'● SYNCED',locked:'● KEY?',offline:'● OFFLINE'})[this.mode];},
  async init(){try{const r=await fetch(API,{headers:this.hdr(),cache:'no-store'});
      if(r.status===401){this.mode='locked';render();return;}
      if(!r.ok||!(r.headers.get('content-type')||'').includes('json')){return;}
      const j=await r.json();if(!j||!('state' in j))return;this.mode='remote';this.apply(j.state);await this.push();
      if(!this.poll)this.poll=setInterval(()=>this.pull(),4000);render();}catch(e){}},
  apply(remote){if(!remote)return;const before=sig(S);const prevMsgs=live('messages').length;S=mergeState(S,normalize(remote));
    if(sig(S)!==before){save();const newMsgs=live('messages').length>prevMsgs;checkAch();
      if(newMsgs&&me&&tab!=='chat'&&unread()){sfx('blip');toast('💬 New message from '+USERS[partner()].name);}render();}},
  async pull(){if(this.busy||document.hidden)return;try{const r=await fetch(API,{headers:this.hdr(),cache:'no-store'});
      if(r.status===401){this.mode='locked';return;}if(r.ok){const j=await r.json();if(this.mode!=='remote'){this.mode='remote';render();}this.apply(j.state);}}catch(e){if(this.mode!=='offline'){this.mode='offline';render();}}},
  dirty(){if(this.mode==='local'||this.mode==='locked')return;clearTimeout(this.t);this.t=setTimeout(()=>this.push(),350);},
  async push(){this.busy=true;try{const r=await fetch(API,{method:'PUT',headers:this.hdr(),body:JSON.stringify({state:S})});
      if(r.ok){const j=await r.json();this.mode='remote';this.busy=false;this.apply(j.state);}else if(r.status===401){this.mode='locked';}}catch(e){this.mode='offline';}this.busy=false;}
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Sync.mode!=='local')Sync.pull();});

/* ---------- boot ---------- */
seed();
render();
if(me)checkAch();
Sync.init();
setInterval(()=>{if(me&&!$('#modal').innerHTML)render();},60000); // rolls quests over at midnight
</script>
