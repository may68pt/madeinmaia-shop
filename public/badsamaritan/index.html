<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8" />
<base href="/badsamaritan/" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#0b0a12" />
<meta name="apple-mobile-web-app-title" content="Bad Samaritan" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="favicon-32.png" />
<meta name="description" content="Bad Samaritan: O Pulso do Porto — um jogo de plataformas 16-bit da Made in Maia. Porto e Maia, dez níveis, dez chefes." />
<title>Bad Samaritan: O Pulso do Porto — Made in Maia</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0a12;
    overscroll-behavior: none; touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  body { position: fixed; inset: 0; font-family: ui-monospace, Menlo, monospace; color: #f4ecd8; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    box-sizing: border-box; }
  #stage { position: relative; flex: 0 0 auto; }
  canvas#game { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; width: 100%; height: 100%; }
  #touch { position: absolute; inset: 0; pointer-events: none; }
  #touch.portrait { position: relative; inset: auto; flex: 1 1 auto; width: 100%; }
  .tc { position: absolute; pointer-events: none; border-radius: 50%; border: 2px solid rgba(244,236,216,.35);
    background: rgba(20,18,30,.35); color: rgba(244,236,216,.85); display: flex; align-items: center; justify-content: center;
    font: 700 13px ui-monospace, Menlo, monospace; letter-spacing: 1px; box-sizing: border-box; }
  .tc.on { background: rgba(255,90,60,.45); border-color: rgba(255,200,120,.9); }
  .pad { border-radius: 22px; }
  .pad .seg { position: absolute; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .pad .seg.on { color: #ffcf6a; text-shadow: 0 0 6px #ff6a3c; }
  #pauseBtn { position: absolute; width: 40px; height: 40px; border-radius: 10px; pointer-events: none; }
  #hidden { display: none; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game" width="480" height="270"></canvas></div>
</div>
<script src="game.js"></script>
</body>
</html>
